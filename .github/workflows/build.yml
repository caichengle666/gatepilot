name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            extension: ""
          - name: linux-arm64
            goos: linux
            goarch: arm64
            extension: ""
          - name: windows-amd64
            goos: windows
            goarch: amd64
            extension: .exe
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            extension: ""
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            extension: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/gatepilot-${GOOS}-${GOARCH}${EXTENSION}" .
      - uses: actions/upload-artifact@v7
        with:
          name: gatepilot-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENVPN_VERSION: "2.6.21"
      OPENVPN_BUILD: "I001"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: gatepilot-*
          merge-multiple: false
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          version="${GITHUB_REF_NAME#v}"

          for artifact_directory in artifacts/gatepilot-*/; do
            artifact_name="$(basename "$artifact_directory")"
            suffix="${artifact_name#gatepilot-}"
            for file in "${artifact_directory}"*; do
              extension="${file##*.}"
              if [ "$extension" = "exe" ]; then
                cp "$file" "release/gatepilot-${version}-${suffix}.exe"
              else
                cp "$file" "release/gatepilot-${version}-${suffix}"
              fi
            done
          done

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          msi_url="https://swupdate.openvpn.org/community/releases/OpenVPN-${OPENVPN_VERSION}-${OPENVPN_BUILD}-amd64.msi"
          curl -fL --retry 3 -o openvpn.msi "$msi_url"
          7z x -y openvpn.msi -oopenvpn-msi >/dev/null

          portable="gatepilot-${version}-windows-amd64-portable"
          mkdir -p "release/${portable}/openvpn"
          cp "release/gatepilot-${version}-windows-amd64.exe" "release/${portable}/gatepilot.exe"
          cp openvpn-msi/openvpn.exe "release/${portable}/openvpn/openvpn.exe"
          cp openvpn-msi/tapctl.exe "release/${portable}/openvpn/tapctl.exe"
          cp openvpn-msi/libcrypto-3-x64.dll "release/${portable}/openvpn/libcrypto-3-x64.dll"
          cp openvpn-msi/libssl-3-x64.dll "release/${portable}/openvpn/libssl-3-x64.dll"
          cp openvpn-msi/libpkcs11-helper-1.dll "release/${portable}/openvpn/libpkcs11-helper-1.dll"
          cp openvpn-msi/vcruntime140.dll "release/${portable}/openvpn/vcruntime140.dll"
          cp README.md LICENSE "release/${portable}/"

          (cd release && zip -qr "${portable}.zip" "$portable")
          rm -rf "release/${portable}"

          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
