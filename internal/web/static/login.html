<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GatePilot - 安全登录</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: #0e1116;
      --bg-surface: #151a21;
      --bg-surface-2: #1b212a;
      --bg-inset: #0b0e13;
      --border-color: #262d38;
      --border-strong: #333b48;
      --text-primary: #e7eaee;
      --text-secondary: #9aa3b0;
      --text-muted: #6c7584;
      --primary: #4c8dff;
      --primary-strong: #3a7af0;
      --primary-soft: rgba(76, 141, 255, 0.12);
      --primary-border: rgba(76, 141, 255, 0.38);
      --success: #3fb97a;
      --danger: #e5534b;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px 16px;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .login-title {
      font-size: 18px;
      font-weight: 650;
      color: var(--text-primary);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 2px 0 0;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrapper { position: relative; }

    .input-field {
      width: 100%;
      height: 42px;
      background: var(--bg-inset);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .input-field::placeholder { color: var(--text-muted); }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .error-message {
      color: #f0726b;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
      text-align: left;
      display: none;
    }

    .login-btn {
      width: 100%;
      height: 42px;
      margin-top: 8px;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s ease, opacity .15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-btn:hover { background: var(--primary-strong); border-color: var(--primary-strong); }
    .login-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-foot {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 420px) {
      .login-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-row">
        <div class="brand-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div>
          <h2 class="login-title">GatePilot</h2>
          <p class="login-subtitle">请输入您的管理账号和安全密码以继续</p>
        </div>
      </div>

      <form id="login_form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">管理账号</label>
          <div class="input-wrapper">
            <input type="text" id="username" name="username" class="input-field" placeholder="请输入管理账号" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">安全密码</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="input-field" placeholder="请输入安全密码" required autocomplete="current-password">
          </div>
          <div id="error_text" class="error-message"></div>
        </div>
        
        <button type="submit" id="submit_btn" class="login-btn">
          <span>登录</span>
        </button>
      </form>
    </div>
    <div class="login-foot">GatePilot 节点管理系统</div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const uname = document.getElementById("username").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const errorText = document.getElementById("error_text");
      const submitBtn = document.getElementById("submit_btn");
      
      errorText.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.querySelector("span").textContent = "正在验证...";
      
      try {
        const response = await fetch("./api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: uname, password: pwd })
        });
        
        const data = await response.json();
        if (response.ok && data.ok) {
          window.location.reload();
        } else {
          errorText.textContent = data.error || "账号或密码不正确，请重新输入";
          errorText.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = "登录";
        }
      } catch (err) {
        errorText.textContent = "连接服务器失败，请稍后重试";
        errorText.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.querySelector("span").textContent = "登录";
      }
    }
  </script>
</body>
</html>
