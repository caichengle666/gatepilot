services:
  gatepilot:
    image: ${GATEPILOT_IMAGE:-ghcr.io/caichengle666/gatepilot:latest}
    build:
      context: .
    container_name: gatepilot
    restart: unless-stopped
    mem_limit: ${GATEPILOT_MEMORY_LIMIT:-512m}
    cpus: ${GATEPILOT_CPU_LIMIT:-2.0}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      GATEPILOT_DOCKER: "true"
      VPNGATE_DATA_DIR: /var/lib/gatepilot
      UI_HOST: 0.0.0.0
      UI_PORT: ${GATEPILOT_UI_PORT:-8787}
      LOCAL_PROXY_HOST: 0.0.0.0
      LOCAL_PROXY_PORT: ${GATEPILOT_PROXY_PORT:-7928}
      LOCAL_PROXY_TUNNEL_PORT_START: ${GATEPILOT_TUNNEL_PROXY_PORT_START:-7929}
      LOCAL_PROXY_PUBLISHED_HOST: ${GATEPILOT_PROXY_BIND:-127.0.0.1}
      LOCAL_PROXY_PUBLISHED_PORT: ${GATEPILOT_PROXY_PORT:-7928}
      LOCAL_PROXY_TUNNEL_PUBLISHED_PORT_START: ${GATEPILOT_TUNNEL_PROXY_PORT_START:-7929}
      LOCAL_PROXY_BIND_TUN: "true"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GATEPILOT_UI_BIND:-0.0.0.0}:${GATEPILOT_UI_PORT:-8787}:${GATEPILOT_UI_PORT:-8787}"
      - "${GATEPILOT_PROXY_BIND:-127.0.0.1}:${GATEPILOT_PROXY_PORT:-7928}:${GATEPILOT_PROXY_PORT:-7928}"
      - "${GATEPILOT_PROXY_BIND:-127.0.0.1}:${GATEPILOT_TUNNEL_PROXY_PORT_START:-7929}-${GATEPILOT_TUNNEL_PROXY_PORT_END:-7936}:${GATEPILOT_TUNNEL_PROXY_PORT_START:-7929}-${GATEPILOT_TUNNEL_PROXY_PORT_END:-7936}"
    volumes:
      - ./data:/var/lib/gatepilot
